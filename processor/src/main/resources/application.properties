spring.application.name=caseroute-processor
server.address=127.0.0.1
server.port=8083
management.endpoints.web.exposure.include=health

# No database access: the processor only talks to Kafka.
# Consumes "case X was saved" events published by the backend's outbox relay, and publishes each result to
# cases.processed, which the backend consumes to update the case. The backend creates both topics.
caseroute.kafka.saved-topic=cases.saved
caseroute.kafka.processed-topic=cases.processed
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=case-processor
spring.kafka.consumer.auto-offset-reset=earliest
# Cases per fetch. Fetching never waits for slow cases (see CaseConsumerLoop), so this only affects efficiency.
spring.kafka.consumer.max-poll-records=2000
# Consumers are run by CaseConsumerLoop (not a @KafkaListener), which commits offsets itself.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all

# Simulated processing. Each case's timing and failures are derived from its clientRequestId,
# so the same case behaves the same way in every run (reproducible, but random-looking).
# Work is simulated as waiting (like calling an external service), not CPU use.
caseroute.processing.mean-ms=1000
caseroute.processing.slow-fraction=0.01
caseroute.processing.slow-ms=10000
caseroute.processing.transient-failure-rate=0.02
caseroute.processing.max-attempts=3
caseroute.processing.retry-backoff-ms=500
caseroute.processing.permanent-failure-rate=0.001
# Kafka consumers (one platform thread each). Useful up to the topic's partition count (6).
caseroute.processing.consumers=6
# Cases being worked on at once, each on a virtual thread. When nearly full, consumers stop fetching (backpressure).
# Throughput is about max-in-flight / average case time: 20,000 / ~1.1 s = ~18,000 cases/s.
caseroute.processing.max-in-flight=20000
