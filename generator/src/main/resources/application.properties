spring.application.name=caseroute-generator
server.address=127.0.0.1
server.port=8081
generator.target-url=http://localhost:8080/api/cases
generator.report-directory=reports
# Retries (when enabled per run): attempts include the first send; waits double from base-delay up to max-delay.
generator.retry.max-attempts=5
generator.retry.base-delay=500ms
generator.retry.max-delay=8s
# Independent HTTP clients to the backend. Each has its own network thread, lock and connection pool;
# one client's single network thread choked at ~10,000 requests/s.
generator.http-clients=8
# Jetty HTTP client (runs with httpClient=JETTY): instances (each has its own waiting line and lock), total
# connections to the backend and total requests allowed to wait for one (both split across the instances), and
# network threads per instance.
# 8 measured best: 16 lowered a 1M connection test from about 15,000-16,900 to 11,600-14,300 requests/s.
generator.jetty.clients=8
generator.jetty.max-connections=2000
# Short on purpose: about 1 s of work at ~15,000/s. A request with no room is counted as Skipped (never sent).
# A long line (100,000) let waits grow until requests timed out, and each timeout closes a connection and
# holds a port for 2 minutes, which builds up the longer a run lasts.
generator.jetty.max-queued=10000
generator.jetty.selectors=1
# Fixed pool: 0 = idle connections are never closed. They are opened once (gradually, during a warm-up) and kept,
# so a brief backend slowdown never needs a burst of new connections. A 30 s timeout shrank the pool during calm
# periods; the next slowdown opened 874 connections in one second and about 2,750 requests were refused.
# The backend keeps idle connections open too (server.tomcat.keep-alive-timeout=-1).
generator.jetty.idle-timeout=0
