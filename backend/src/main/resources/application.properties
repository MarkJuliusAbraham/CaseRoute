spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/caseroutedb?reWriteBatchedInserts=true
spring.datasource.username=caseroutedb
spring.datasource.password=localdev
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# DevTools would restart the app whenever compiled classes change (an IntelliJ build, a Maven test run),
# even in the middle of a load test. Restarts happen only when you restart it yourself.
spring.devtools.restart.enabled=false

# Connections the OS may queue while the backend briefly cannot accept (e.g. a GC pause).
# Tomcat's default of 100 overflows in ~60 ms at 1,667 requests/s. The OS may cap this lower.
server.tomcat.accept-count=2000

# Keep-alive connections are reused for the whole run. Tomcat's default closes each connection after
# 100 requests, forcing a new connection (handshake, a port held in TIME_WAIT) every 100 requests.
server.tomcat.max-keep-alive-requests=-1
# Idle connections are never closed (-1): the generator keeps a fixed pool of connections for as long as it runs,
# so nothing changes with time and neither side can close a connection the other is sending on. Idle connections
# cost Tomcat almost nothing (NIO). The connection timeout also covers a connection that has not sent its first
# request yet, which a pre-opened connection may not do for a while; without -1 Tomcat closed those after 60 s.
# Local simulator settings: a public server would keep timeouts, to drop clients that disappear.
server.tomcat.keep-alive-timeout=-1
server.tomcat.connection-timeout=-1

# Virtual threads: one per request instead of Tomcat's pool of 200 OS threads. Request threads spend
# almost all their time waiting for Kafka to confirm a write, and at ~600k/min the 200-thread pool ran out
# (200 threads / ~20 ms per confirmation = ~10,000 requests/s). Virtual threads make waiting nearly free.
# An earlier 100k/min test with them was worse (~20 ms -> 100-1,500 ms), but the generator itself was
# stalling at the time (fixed since), so that result is being retested. Without the pool there is also no
# brake: under overload every request goes on to Kafka at once. Set to false for the 200-thread pool.
spring.threads.virtual.enabled=true

# Graceful shutdown: on a normal stop the web server refuses new connections, lets requests in progress finish and
# reply (up to 20 s), then Kafka and the database close. A restart this way leaves no request in doubt; without it,
# requests in progress were cut off, and their clients could not know whether Kafka had them.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Streamed downloads (the checker's ledger, the CSV export) run as asynchronous requests, which Tomcat ends after 30 s
# by default, without an error: the response simply stops. A million-case ledger read while the backend was slow
# (just restarted) was cut off at 100,441 rows, and the checker reported the rest as missing. 10 minutes is ample.
spring.mvc.async.request-timeout=10m

# Local simulator only: permits confirmed case reset from loopback connections.
simulation.reset-enabled=true
simulation.reports-enabled=true

# Case submissions: the API replies 202 only after Kafka confirms the write; consumers save to Postgres.
caseroute.kafka.submissions-topic=cases.submitted
caseroute.kafka.submissions-partitions=6
caseroute.kafka.publish-timeout=10s
# Outbox relay: publishes "case.saved" rows to this topic for the processor application, then deletes them.
caseroute.kafka.saved-topic=cases.saved
# Processing results from the processor application; the backend records them on the cases table.
caseroute.kafka.processed-topic=cases.processed
# Load-test warm-up traffic (POST /api/cases/warmup). Nothing consumes it; kept for 1 hour.
caseroute.kafka.warmup-topic=cases.warmup
caseroute.outbox.batch-size=1000
caseroute.outbox.poll-interval-ms=100
# Kafka keeps messages after they are consumed; these bound how long load-test data stays on disk.
caseroute.kafka.retention=6h
caseroute.kafka.segment=1h
# Apply retention changes to topics that already exist, not only to newly created ones.
spring.kafka.admin.modify-topic-configs=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
# Partitions can be added while running (dashboard, Kafka panel). Producers and consumers only notice new partitions
# when they refresh topic metadata, by default every 5 minutes: until then nothing is written to or read from them.
# 10 s makes an added partition usable before the next run.
spring.kafka.producer.properties.metadata.max.age.ms=10000
spring.kafka.consumer.properties.metadata.max.age.ms=10000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=case-writer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=500
spring.kafka.listener.type=batch
spring.kafka.listener.concurrency=3
